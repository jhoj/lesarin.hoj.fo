name: Deploy

# Runs when a PR is merged (i.e. a push lands on main). GitHub-hosted machines
# do the heavy lifting — build the Angular app and run the backend tests — and
# only if everything is green does the *self-hosted runner on the VPS* pick up
# the deploy job and put the release in place locally. No SSH keys or secrets:
# the runner only makes outbound HTTPS calls to GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overlap; queue them instead of cancelling so a half-
# finished sync is never interrupted.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Build the frontend (so the VPS needs no Node) ------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Angular app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # --- Test the backend (deploy is gated on green) -------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      # --- Hand the built UI to the deploy job ---------------------------
      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/lesarin/browser
          retention-days: 3

  deploy:
    needs: build-test
    # The runner installed on the VPS (Settings → Actions → Runners). It runs
    # as the local 'deploy' user, so everything below happens on the server
    # itself — no SSH, no secrets.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/lesarin/browser

      - name: Sync release into place
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'data' \
            --exclude '__pycache__' \
            ./ /opt/lesarin/

      - name: Install deps + restart service
        run: bash /opt/lesarin/deploy/deploy.sh
