name: Deploy

# Two things happen here.
#
# * On a **pull request**, GitHub-hosted machines build the Angular app and run
#   the backend tests, so a branch is proven green *before* it can be merged.
#   The deploy job is skipped — unmerged code never reaches the server.
# * On a **push to main** (i.e. a merge), the same build + test gate runs, and
#   only if it's green does the *self-hosted runner on the VPS* pick up the
#   deploy job and put the release in place locally. No SSH keys or secrets:
#   the runner only makes outbound HTTPS calls to GitHub.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Deploys must never overlap, so pushes to main share one group and queue
# instead of cancelling — a half-finished sync is never interrupted. Pull
# requests get a group per branch, where superseding an outdated run is right.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Build the frontend (so the VPS needs no Node) ------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Angular app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # --- Test the frontend (jsdom, no browser needed) ------------------
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      # --- Test the backend (deploy is gated on green) -------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      # --- Hand the built UI to the deploy job ---------------------------
      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/lesarin/browser
          retention-days: 3

  deploy:
    needs: build-test
    # Never deploy a pull request — only main, once it's green. Without this
    # guard the new pull_request trigger above would ship unmerged code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The runner installed on the VPS (Settings → Actions → Runners). It runs
    # as the local 'deploy' user, so everything below happens on the server
    # itself — no SSH, no secrets.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/lesarin/browser

      - name: Sync release into place
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'data' \
            --exclude '__pycache__' \
            ./ /opt/lesarin/

      - name: Install deps + restart service
        run: bash /opt/lesarin/deploy/deploy.sh
